<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Context 投影与压缩：Session 全量历史经 project() 投影为 Working Context，溢出段分流至 long_term.store，压缩摘要重新投影回窗口">
  <defs>
    <style>
      .lbl { font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #1c2b24; }
      .sub { font-family: "JetBrains Mono", Menlo, monospace; fill: #7b8a83; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    </style>
  </defs>

  <!-- light card (reads on both light & dark site themes) -->
  <rect x="16" y="16" width="1168" height="568" rx="16" fill="#ffffff" stroke="rgba(28,43,36,0.12)"/>

  <!-- left: Session full history (append-only) -->
  <text x="145" y="74" text-anchor="middle" class="lbl" font-size="17" font-weight="600">Session 全量历史</text>
  <text x="145" y="96" text-anchor="middle" class="sub" font-size="12">append-only · 只增不改（I1）</text>

  <g>
    <rect x="70" y="130" width="150" height="56" rx="8" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
    <text x="84" y="152" class="mono" font-size="11.5" fill="#7b8a83">turn 01</text>
    <rect x="84" y="162" width="110" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>
    <rect x="84" y="173" width="78" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>

    <rect x="70" y="194" width="150" height="56" rx="8" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
    <text x="84" y="216" class="mono" font-size="11.5" fill="#7b8a83">turn 02</text>
    <rect x="84" y="226" width="110" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>
    <rect x="84" y="237" width="78" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>

    <rect x="70" y="258" width="150" height="56" rx="8" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
    <text x="145" y="293" text-anchor="middle" class="mono" font-size="18" fill="#7b8a83">⋮</text>

    <rect x="70" y="322" width="150" height="56" rx="8" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
    <text x="84" y="344" class="mono" font-size="11.5" fill="#7b8a83">turn 23</text>
    <rect x="84" y="354" width="110" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>
    <rect x="84" y="365" width="78" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>

    <rect x="70" y="386" width="150" height="56" rx="8" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
    <text x="84" y="408" class="mono" font-size="11.5" fill="#7b8a83">turn 24</text>
    <rect x="84" y="418" width="110" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>
    <rect x="84" y="429" width="78" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>

    <rect x="70" y="450" width="150" height="56" rx="8" fill="#f3f1ea" stroke="#40514a" stroke-width="1.5"/>
    <text x="84" y="472" class="mono" font-size="11.5" fill="#40514a">turn 25 · latest</text>
    <rect x="84" y="482" width="110" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>
    <rect x="84" y="493" width="78" height="5" rx="2.5" fill="rgba(28,43,36,0.12)"/>
  </g>

  <!-- middle: project() projection function (accent 1) -->
  <circle cx="390" cy="175" r="52" fill="#f3f1ea" stroke="#2e7d5b" stroke-width="2"/>
  <text x="390" y="170" text-anchor="middle" class="mono" font-size="17" font-weight="600" fill="#1c2b24">project()</text>
  <text x="390" y="193" text-anchor="middle" class="lbl" font-size="14" fill="#40514a">投影</text>

  <!-- flow: Session → project() → Working Context -->
  <path d="M 234 175 L 322 175" fill="none" stroke="#40514a" stroke-width="1.8"/>
  <path d="M 456 175 L 544 175" fill="none" stroke="#40514a" stroke-width="1.8"/>
  <text x="500" y="156" text-anchor="middle" class="sub" font-size="11.5">per request</text>

  <!-- right top: Working Context window bar -->
  <text x="845" y="74" text-anchor="middle" class="lbl" font-size="17" font-weight="600">Working Context 窗口</text>
  <text x="845" y="96" text-anchor="middle" class="sub" font-size="12">本次请求的投影视图 · W = 200K</text>

  <rect x="560" y="140" width="570" height="70" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <line x1="655" y1="140" x2="655" y2="210" stroke="rgba(28,43,36,0.18)"/>
  <line x1="760" y1="140" x2="760" y2="210" stroke="rgba(28,43,36,0.18)"/>
  <line x1="875" y1="140" x2="875" y2="210" stroke="rgba(28,43,36,0.18)"/>
  <line x1="935" y1="140" x2="935" y2="210" stroke="rgba(28,43,36,0.18)"/>

  <text x="607" y="170" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#1c2b24">sys</text>
  <text x="607" y="191" text-anchor="middle" class="lbl" font-size="11.5" fill="#40514a">系统提示</text>
  <text x="707" y="170" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#1c2b24">usr</text>
  <text x="707" y="191" text-anchor="middle" class="lbl" font-size="11.5" fill="#40514a">用户消息</text>
  <text x="817" y="170" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#1c2b24">obs</text>
  <text x="817" y="191" text-anchor="middle" class="lbl" font-size="11.5" fill="#40514a">工具观察</text>
  <text x="905" y="179" text-anchor="middle" class="mono" font-size="17" fill="#7b8a83">…</text>
  <text x="1032" y="170" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#1c2b24">ctx</text>
  <text x="1032" y="191" text-anchor="middle" class="lbl" font-size="11.5" fill="#40514a">当前轮次</text>

  <!-- overflow segments (oldest turns) -->
  <rect x="652" y="136" width="226" height="78" rx="8" fill="none" stroke="#7b8a83" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- FULL badge -->
  <rect x="1038" y="106" width="92" height="24" rx="12" fill="#181d1a"/>
  <text x="1084" y="122" text-anchor="middle" class="mono" font-size="12" fill="#e8f0eb">FULL · 满格</text>

  <!-- overflow arc: window → long_term.store -->
  <path d="M 660 210 C 640 300 700 360 758 394" fill="none" stroke="#40514a" stroke-width="1.8"/>
  <text x="636" y="300" text-anchor="end" class="lbl" font-size="13" fill="#40514a">溢出段分流</text>
  <text x="636" y="322" text-anchor="end" class="sub" font-size="11.5">oldest turns</text>

  <!-- long_term.store (accent 2) -->
  <rect x="720" y="410" width="260" height="70" rx="10" fill="#f3f1ea" stroke="#2e7d5b" stroke-width="1.8"/>
  <text x="850" y="442" text-anchor="middle" class="mono" font-size="15" font-weight="600" fill="#1c2b24">long_term.store</text>
  <text x="850" y="466" text-anchor="middle" class="lbl" font-size="12.5" fill="#40514a">投影而非改写 · 原文可回查</text>

  <!-- return arc: compaction summary re-projected into window -->
  <path d="M 940 396 C 960 300 1020 260 1058 226" fill="none" stroke="#40514a" stroke-width="1.8"/>
  <text x="1000" y="330" class="mono" font-size="13" fill="#40514a">compaction summary</text>
  <text x="1000" y="352" class="lbl" font-size="12" fill="#7b8a83">压缩摘要 · 重新投影回窗口</text>

  <!-- footer -->
  <text x="600" y="548" text-anchor="middle" class="sub" font-size="12.5">Session 只增不改（I1）· 压缩只改视图、不改事实 —— Context = project(Session)</text>

  <!-- arrowheads LAST (on top of everything) -->
  <polygon points="322,175 307,169 307,181" fill="#40514a"/>
  <polygon points="544,175 529,169 529,181" fill="#40514a"/>
  <polygon points="758,394 743.1,391.7 748.7,382.2" fill="#40514a"/>
  <polygon points="1058,226 1051.3,239.4 1043.9,231.2" fill="#40514a"/>
</svg>
