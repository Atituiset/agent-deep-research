<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="多 Agent 三种编排拓扑对比：Orchestrator-Worker 主从、Swarm 去中心化群、Hierarchical 分层树">
  <defs>
    <style>
      .lbl { font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #1c2b24; }
      .sub { font-family: "JetBrains Mono", Menlo, monospace; fill: #7b8a83; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; }
    </style>
  </defs>

  <!-- light card (reads on both light & dark site themes) -->
  <rect x="16" y="16" width="1168" height="588" rx="16" fill="#ffffff" stroke="rgba(28,43,36,0.12)"/>

  <!-- column dividers (hairlines) -->
  <line x1="402" y1="70" x2="402" y2="550" stroke="rgba(28,43,36,0.12)"/>
  <line x1="798" y1="70" x2="798" y2="550" stroke="rgba(28,43,36,0.12)"/>

  <!-- title capsules -->
  <rect x="115" y="56" width="220" height="52" rx="26" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
  <text x="225" y="82" text-anchor="middle" class="lbl" font-size="15" font-weight="600">主从编排</text>
  <text x="225" y="99" text-anchor="middle" class="sub" font-size="10.5">Orchestrator-Worker</text>

  <rect x="495" y="56" width="220" height="52" rx="26" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
  <text x="605" y="82" text-anchor="middle" class="lbl" font-size="15" font-weight="600">去中心化群</text>
  <text x="605" y="99" text-anchor="middle" class="sub" font-size="10.5">Swarm</text>

  <rect x="870" y="56" width="220" height="52" rx="26" fill="#f3f1ea" stroke="rgba(28,43,36,0.18)"/>
  <text x="980" y="82" text-anchor="middle" class="lbl" font-size="15" font-weight="600">分层树</text>
  <text x="980" y="99" text-anchor="middle" class="sub" font-size="10.5">Hierarchical</text>

  <!-- ═══ Column 1: Orchestrator-Worker ═══ -->
  <!-- dispatch edges (solid, orchestrator → workers) -->
  <line x1="183" y1="208" x2="104" y2="336" stroke="#40514a" stroke-width="1.8"/>
  <line x1="225" y1="208" x2="225" y2="336" stroke="#40514a" stroke-width="1.8"/>
  <line x1="267" y1="208" x2="346" y2="336" stroke="#40514a" stroke-width="1.8"/>
  <!-- aggregate edges (dashed, workers → orchestrator) -->
  <line x1="66" y1="350" x2="160" y2="224" stroke="#40514a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="241" y1="350" x2="241" y2="224" stroke="#40514a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="384" y1="350" x2="290" y2="224" stroke="#40514a" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- orchestrator (accent 1/2) -->
  <rect x="145" y="150" width="160" height="58" rx="10" fill="#f3f1ea" stroke="#2e7d5b" stroke-width="2"/>
  <text x="225" y="176" text-anchor="middle" class="lbl" font-size="15" font-weight="600">Orchestrator</text>
  <text x="225" y="195" text-anchor="middle" class="sub" font-size="10.5">主 Agent · 分解/汇总</text>

  <!-- workers -->
  <rect x="33" y="350" width="104" height="50" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="85" y="372" text-anchor="middle" class="lbl" font-size="13.5" font-weight="600">Worker</text>
  <text x="85" y="389" text-anchor="middle" class="sub" font-size="10">explore</text>
  <rect x="173" y="350" width="104" height="50" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="225" y="372" text-anchor="middle" class="lbl" font-size="13.5" font-weight="600">Worker</text>
  <text x="225" y="389" text-anchor="middle" class="sub" font-size="10">explore</text>
  <rect x="313" y="350" width="104" height="50" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="365" y="372" text-anchor="middle" class="lbl" font-size="13.5" font-weight="600">Worker</text>
  <text x="365" y="389" text-anchor="middle" class="sub" font-size="10">explore</text>

  <!-- edge labels -->
  <text x="62" y="256" text-anchor="middle" class="lbl" font-size="12">派发</text>
  <text x="62" y="271" text-anchor="middle" class="sub" font-size="10">dispatch</text>
  <text x="388" y="256" text-anchor="middle" class="lbl" font-size="12">回流</text>
  <text x="388" y="271" text-anchor="middle" class="sub" font-size="10">aggregate</text>

  <text x="225" y="478" text-anchor="middle" class="sub" font-size="11">代表：Claude AgentTool · TodoWrite</text>

  <!-- ═══ Column 2: Swarm ═══ -->
  <!-- mesh edges (peer-to-peer) -->
  <line x1="571" y1="200" x2="509" y2="259" stroke="#40514a" stroke-width="1.5"/>
  <line x1="639" y1="200" x2="702" y2="259" stroke="#40514a" stroke-width="1.5"/>
  <line x1="509" y1="322" x2="571" y2="381" stroke="#40514a" stroke-width="1.5"/>
  <line x1="702" y1="322" x2="639" y2="381" stroke="#40514a" stroke-width="1.5"/>
  <line x1="605" y1="214" x2="605" y2="366" stroke="#40514a" stroke-width="1.5"/>
  <line x1="521" y1="290" x2="689" y2="290" stroke="#40514a" stroke-width="1.5"/>

  <!-- peer nodes -->
  <circle cx="605" cy="168" r="46" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="605" y="165" text-anchor="middle" class="lbl" font-size="15" font-weight="600">Agent</text>
  <text x="605" y="183" text-anchor="middle" class="sub" font-size="10.5">peer A</text>
  <circle cx="475" cy="290" r="46" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="475" y="287" text-anchor="middle" class="lbl" font-size="15" font-weight="600">Agent</text>
  <text x="475" y="305" text-anchor="middle" class="sub" font-size="10.5">peer B</text>
  <circle cx="735" cy="290" r="46" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="735" y="287" text-anchor="middle" class="lbl" font-size="15" font-weight="600">Agent</text>
  <text x="735" y="305" text-anchor="middle" class="sub" font-size="10.5">peer C</text>
  <circle cx="605" cy="412" r="46" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="605" y="409" text-anchor="middle" class="lbl" font-size="15" font-weight="600">Agent</text>
  <text x="605" y="427" text-anchor="middle" class="sub" font-size="10.5">peer D</text>

  <!-- message-passing chip (covers mesh crossing) -->
  <rect x="530" y="267" width="150" height="46" rx="23" fill="#ffffff" stroke="rgba(28,43,36,0.18)"/>
  <text x="605" y="287" text-anchor="middle" class="lbl" font-size="12.5">消息传递</text>
  <text x="605" y="303" text-anchor="middle" class="sub" font-size="10">message passing</text>

  <text x="605" y="478" text-anchor="middle" class="sub" font-size="11">去中心化 · 一致性需额外协议</text>

  <!-- ═══ Column 3: Hierarchical ═══ -->
  <!-- tree edges: root → middle -->
  <line x1="950" y1="180" x2="900" y2="251" stroke="#40514a" stroke-width="1.8"/>
  <line x1="1010" y1="180" x2="1060" y2="251" stroke="#40514a" stroke-width="1.8"/>
  <!-- tree edges: middle → leaf -->
  <line x1="865" y1="311" x2="858" y2="381" stroke="#40514a" stroke-width="1.8"/>
  <line x1="905" y1="311" x2="968" y2="381" stroke="#40514a" stroke-width="1.8"/>
  <line x1="1095" y1="311" x2="1102" y2="381" stroke="#40514a" stroke-width="1.8"/>

  <!-- root -->
  <rect x="910" y="130" width="140" height="50" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="980" y="152" text-anchor="middle" class="lbl" font-size="14" font-weight="600">Root</text>
  <text x="980" y="169" text-anchor="middle" class="sub" font-size="10.5">主 Agent</text>

  <!-- middle layer -->
  <rect x="830" y="265" width="120" height="46" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="890" y="285" text-anchor="middle" class="lbl" font-size="13" font-weight="600">Sub-agent</text>
  <text x="890" y="301" text-anchor="middle" class="sub" font-size="10">中间层</text>
  <rect x="1010" y="265" width="120" height="46" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="1070" y="285" text-anchor="middle" class="lbl" font-size="13" font-weight="600">Sub-agent</text>
  <text x="1070" y="301" text-anchor="middle" class="sub" font-size="10">中间层</text>

  <!-- leaf workers -->
  <rect x="805" y="395" width="100" height="44" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="855" y="414" text-anchor="middle" class="lbl" font-size="12.5" font-weight="600">Worker</text>
  <text x="855" y="430" text-anchor="middle" class="sub" font-size="9.5">叶节点</text>
  <rect x="930" y="395" width="100" height="44" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="980" y="414" text-anchor="middle" class="lbl" font-size="12.5" font-weight="600">Worker</text>
  <text x="980" y="430" text-anchor="middle" class="sub" font-size="9.5">叶节点</text>
  <rect x="1055" y="395" width="100" height="44" rx="10" fill="#f3f1ea" stroke="rgba(28,43,36,0.35)" stroke-width="1.5"/>
  <text x="1105" y="414" text-anchor="middle" class="lbl" font-size="12.5" font-weight="600">Worker</text>
  <text x="1105" y="430" text-anchor="middle" class="sub" font-size="9.5">叶节点</text>

  <!-- nesting constraint badge (accent 2/2) -->
  <rect x="885" y="462" width="190" height="44" rx="22" fill="none" stroke="#2e7d5b" stroke-width="1.5"/>
  <text x="980" y="482" text-anchor="middle" class="lbl" font-size="12.5" fill="#2e7d5b">铁律：嵌套 ≤ 1 层</text>
  <text x="980" y="498" text-anchor="middle" class="sub" font-size="10">no nested teammate</text>

  <!-- arrowheads LAST (on top of everything) -->
  <!-- col1: dispatch -->
  <polygon points="104,336 106,323.2 114.6,328.4" fill="#40514a"/>
  <polygon points="225,336 220,324 230,324" fill="#40514a"/>
  <polygon points="346,336 335.4,328.4 344,323.2" fill="#40514a"/>
  <!-- col1: aggregate -->
  <polygon points="160,224 148.8,230.6 156.8,236.6" fill="#40514a"/>
  <polygon points="241,224 236,236 246,236" fill="#40514a"/>
  <polygon points="290,224 293.2,236.6 301.2,230.6" fill="#40514a"/>
  <!-- col2: swarm message flow -->
  <polygon points="518.7,248.9 524.1,237.1 530.9,244.3" fill="#40514a"/>
  <polygon points="518.7,331.1 524.1,342.9 530.9,335.7" fill="#40514a"/>
  <polygon points="648.7,370.9 654.1,359.1 660.9,366.3" fill="#40514a"/>
  <!-- col3: tree -->
  <polygon points="900,251 902.8,238.3 911,244.1" fill="#40514a"/>
  <polygon points="1060,251 1049,244.1 1057.2,238.3" fill="#40514a"/>
  <polygon points="858,381 854.2,368.6 864.2,369.6" fill="#40514a"/>
  <polygon points="968,381 956.3,374.4 963.7,369.8" fill="#40514a"/>
  <polygon points="1102,381 1095.8,369.6 1105.8,368.6" fill="#40514a"/>
</svg>
